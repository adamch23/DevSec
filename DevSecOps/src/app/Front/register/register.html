<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Register / Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap" rel="stylesheet">
</head>
<body>

<div class="main">
  <input type="checkbox" id="chk" aria-hidden="true" />

  <!-- Section d'inscription -->
  <!-- Inscription -->
<div class="signup">
  <form (ngSubmit)="onRegister()">
    <label for="chk" aria-hidden="true">Sign up</label>
    <input type="text" [(ngModel)]="user.username" name="username" placeholder="Username" required />
    <input type="email" [(ngModel)]="user.email" name="email" placeholder="Email" required />
    <input type="number" [(ngModel)]="user.phone" name="phone" placeholder="Phone" required />
    <input type="password" [(ngModel)]="user.password" name="password" placeholder="Password" required />
    <button type="submit">Sign up</button>
  </form>
</div>

<!-- Connexion -->
<div class="login">
  <form (ngSubmit)="onLogin()">
    <label for="chk" aria-hidden="true">Login</label>
    <input type="email" [(ngModel)]="loginData.email" name="loginEmail" placeholder="Email" required />
    <input type="password" [(ngModel)]="loginData.password" name="loginPassword" placeholder="Password" required />
    <button type="submit">Login</button>
  </form>
</div>
